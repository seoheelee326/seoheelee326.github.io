media:
  input: assets/images
  output: /assets/images
  rename: safe
  categories: [image]

content:
  - name: site
    label: 사이트 기본 정보
    type: file
    path: data/site.json
    format: json
    fields:
      - { name: intro_ko, label: 첫 화면 소개 (한국어), type: text }
      - { name: intro_en, label: Intro (English), type: text }
      - { name: about_ko, label: 작가 소개 (한국어), type: text, required: true }
      - { name: about_en, label: About (English), type: text, required: true }
      - { name: based_in_ko, label: 활동 지역 (한국어), type: string }
      - { name: based_in_en, label: Based in (English), type: string }
      - { name: practice_ko, label: 작업 영역 (한국어), type: string }
      - { name: practice_en, label: Practice (English), type: string }
      - { name: email, label: 이메일, type: string }
      - { name: instagram_url, label: 인스타그램 주소, type: string }

  - name: works
    label: Artwork
    type: file
    path: data/works.json
    format: json
    list: true
    fields:
      - { name: artist_ko, label: 작가명 (한국어), type: string, required: true }
      - { name: artist_en, label: Artist name (English), type: string, required: true }
      - { name: title, label: 공식 작품명, type: string, required: true }
      - { name: title_translation_en, label: 영어 해석 (한국어 제목일 때만), type: string }
      - { name: year, label: 제작연도, type: number, required: true }
      - name: category
        label: 작품 유형
        type: select
        options: { values: [Painting, Installation, Media, Drawing, Project, Other] }
      - { name: materials_ko, label: 재료 (한국어), type: string, required: true }
      - { name: materials_en, label: Materials (English), type: string, required: true }
      - { name: height_cm, label: 세로 (cm), type: number, required: true }
      - { name: width_cm, label: 가로 (cm), type: number, required: true }
      - { name: description_ko, label: 작품 설명 (한국어), type: text }
      - { name: description_en, label: Description (English), type: text }
      - { name: image, label: 대표 이미지, type: image }
      - { name: gallery, label: 추가 이미지, type: image, list: true }
      - { name: featured, label: 대표 작품, type: boolean }
      - { name: published, label: 사이트에 공개, type: boolean }

  - name: projects
    label: Arts Education / Public Art
    type: file
    path: data/projects.json
    format: json
    list: true
    fields:
      - { name: title_ko, label: 프로젝트명 (한국어), type: string, required: true }
      - { name: title_en, label: Project title (English), type: string, required: true }
      - { name: year, label: 연도, type: number }
      - name: category
        label: 분야
        type: select
        required: true
        options: { values: [Arts Education, Public Art] }
      - { name: type_ko, label: 유형 (한국어), type: string }
      - { name: type_en, label: Type (English), type: string }
      - { name: description_ko, label: 간단 소개 (한국어), type: text }
      - { name: description_en, label: Description (English), type: text }
      - { name: image, label: 대표 이미지, type: image }
      - { name: gallery, label: 추가 이미지, type: image, list: true }
      - { name: published, label: 사이트에 공개, type: boolean }

  - name: exhibitions
    label: 전시
    type: file
    path: data/exhibitions.json
    format: json
    list: true
    fields:
      - { name: title_ko, label: 전시명 (한국어), type: string, required: true }
      - { name: title_en, label: Exhibition title (English), type: string, required: true }
      - { name: year, label: 연도, type: number, required: true }
      - { name: venue_ko, label: 전시장 (한국어), type: string }
      - { name: venue_en, label: Venue (English), type: string }
      - { name: location_ko, label: 지역 (한국어), type: string }
      - { name: location_en, label: Location (English), type: string }
      - { name: type_ko, label: 전시 유형 (한국어), type: string }
      - { name: type_en, label: Exhibition type (English), type: string }
      - { name: description_ko, label: 전시 소개 (한국어), type: text }
      - { name: description_en, label: Description (English), type: text }
      - { name: image, label: 대표 이미지, type: image }
      - { name: gallery, label: 설치 전경, type: image, list: true }
      - { name: published, label: 사이트에 공개, type: boolean }
