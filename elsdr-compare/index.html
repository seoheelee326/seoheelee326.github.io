<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#182e29">
<title>ELSDR — Before / After comparison</title>
<style>
:root{color-scheme:light;--ink:#18332b;--sage:#688371;--bg:#edf1eb;--line:#cbd7cc}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Arial,"Noto Sans KR",sans-serif}
a{color:inherit;text-decoration:none}
button,a{cursor:pointer}
.top{display:flex;align-items:center;justify-content:space-between;gap:24px;padding:18px 28px;background:#f6f8f4;border-bottom:1px solid var(--line)}
.brand{font-weight:800;font-size:21px;letter-spacing:-.9px}.brand span{display:block;font-size:10px;letter-spacing:1px;font-weight:500;color:var(--sage);margin-top:5px}
.actions{display:flex;gap:9px;flex-wrap:wrap}
.action{padding:10px 14px;font-weight:600;font-size:11px;border:1px solid #bacfbd;background:transparent;color:var(--ink)}
.action:hover,.action.active{background:#25473b;color:white;border-color:#25473b}
.tools{padding:14px 28px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:20px;background:#eaf0e9;flex-wrap:wrap}
.routes{display:flex;gap:7px;flex-wrap:wrap}
.routes button{font-size:11px;color:#557060;border:1px solid transparent;background:transparent;padding:8px 10px}
.routes button:hover,.routes button.active{background:#fff;border-color:#a9beb1;color:#264c3b}
.note{font-size:11px;color:#627c6e;line-height:1.5}
.panels{height:calc(100dvh - 132px);display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:1px;background:#b9caba}
.panel{min-width:0;min-height:0;background:white;display:flex;flex-direction:column}
.panel-header{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 16px;background:#eef3ec;border-bottom:1px solid #d3ded2;font-size:11px;font-weight:700}
.panel-header span small{font-size:9px;letter-spacing:.8px;font-weight:400;color:#70907c;display:block;margin-bottom:5px}
.panel-header a{border-bottom:1px solid #9eb4a5;padding-bottom:4px;font-size:10px}
iframe{width:100%;border:0;display:block;flex:1;min-height:0;background:white}
.panels.only-before,.panels.only-after{grid-template-columns:minmax(0,1fr)}
.panels.only-before #panel-after,.panels.only-after #panel-before{display:none}
@media(max-width:820px){.top{padding:16px;display:block}.actions{margin-top:15px}.tools{padding:10px 16px}.note{display:none}.panels{height:calc(100dvh - 175px);grid-template-columns:1fr;grid-template-rows:1fr 1fr}.panel-header{padding:7px 13px}.panels.only-before,.panels.only-after{grid-template-rows:1fr}}
</style>
</head>
<body>
<header class="top"><a class="brand" href="../elsdr-preview/">ELSDR <span>WEBSITE DESIGN · VERSION COMPARISON</span></a>
<div class="actions">
<button class="action active" data-view="split" aria-pressed="true">Before / After</button>
<button class="action" data-view="before" aria-pressed="false">Before only</button>
<button class="action" data-view="after" aria-pressed="false">After only</button>
</div></header>
<section class="tools" aria-label="비교할 페이지 선택"><nav class="routes" aria-label="두 버전에 공통으로 적용할 메뉴">
<button data-route="home" class="active">Home</button><button data-route="about">About</button><button data-route="research">Research</button><button data-route="people">People</button><button data-route="study">Study</button><button data-route="life">Life</button><button data-route="contact">Contact</button>
</nav><span class="note">메뉴를 선택하면 두 시안이 같은 페이지로 이동합니다.</span></section>
<main class="panels" id="panels">
<section class="panel" id="panel-before" aria-label="기존 시안">
<div class="panel-header"><span><small>VERSION 01 — PRESERVED</small>기존 시안 / Before</span><a href="../elsdr-preview/" id="open-before" target="_blank" rel="noopener noreferrer">새 창에서 보기 ↗</a></div>
<iframe id="before" src="../elsdr-preview/#/home" title="ELSDR 이전 버전" loading="eager"></iframe>
</section>
<section class="panel" id="panel-after" aria-label="수정 시안">
<div class="panel-header"><span><small>VERSION 02 — WORKING DRAFT</small>수정 시안 / After</span><a href="../elsdr-preview-v2/" id="open-after" target="_blank" rel="noopener noreferrer">새 창에서 보기 ↗</a></div>
<iframe id="after" src="../elsdr-preview-v2/#/home" title="ELSDR 수정 버전" loading="eager"></iframe>
</section>
</main>
<script>
(function(){
  const panels=document.getElementById('panels');
  const before=document.getElementById('before'),after=document.getElementById('after');
  const openBefore=document.getElementById('open-before'),openAfter=document.getElementById('open-after');
  document.querySelectorAll('[data-view]').forEach(btn=>btn.addEventListener('click',()=>{
    const view=btn.dataset.view;
    panels.className='panels'+(view==='split'?'':' only-'+view);
    document.querySelectorAll('[data-view]').forEach(x=>{const on=x===btn;x.classList.toggle('active',on);x.setAttribute('aria-pressed',String(on));});
  }));
  document.querySelectorAll('[data-route]').forEach(btn=>btn.addEventListener('click',()=>{
    const route=btn.dataset.route;
    const hash='#/'+route;
    before.src='../elsdr-preview/'+hash;
    after.src='../elsdr-preview-v2/'+hash;
    openBefore.href='../elsdr-preview/'+hash;
    openAfter.href='../elsdr-preview-v2/'+hash;
    document.querySelectorAll('[data-route]').forEach(x=>x.classList.toggle('active',x===btn));
  }));
})();
</script>
</body>
</html>
