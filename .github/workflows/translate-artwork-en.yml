name: Translate artwork English drafts

on:
  workflow_dispatch:
    inputs:
      payload:
        description: Pages CMS payload as JSON
        required: true
        type: string

permissions:
  contents: write

jobs:
  translate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ fromJson(inputs.payload).repository.ref }}

      - name: Translate missing English artwork fields
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          PAGES_PAYLOAD: ${{ inputs.payload }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          import urllib.request
          from pathlib import Path

          api_key = os.environ.get("OPENAI_API_KEY", "").strip()
          if not api_key:
              raise SystemExit(
                  "OPENAI_API_KEY secret is missing. Add it in GitHub Settings > Secrets and variables > Actions."
              )

          payload = json.loads(os.environ["PAGES_PAYLOAD"])
          overwrite = bool(payload.get("inputs", {}).get("overwrite", False))

          path = Path("data/works.json")
          works = json.loads(path.read_text(encoding="utf-8"))
          changed = False

          def contains_korean(text):
              return bool(re.search(r"[가-힣]", text or ""))

          def call_openai(work):
              source = {
                  "official_title": work.get("title", ""),
                  "materials_ko": work.get("materials_ko", ""),
                  "description_ko": work.get("description_ko", ""),
              }
              system = (
                  "You translate Korean contemporary-art metadata into concise, natural professional English. "
                  "Return ONLY a valid JSON object with exactly these keys: "
                  "title_translation_en, materials_en, description_en. "
                  "For title_translation_en: translate the meaning only when official_title contains Korean; "
                  "otherwise return an empty string. Do not replace or romanize the official title. "
                  "For materials_en: use standard artwork-caption wording, e.g. 'Acrylic on canvas'. "
                  "For description_en: preserve tone and meaning without adding interpretation. "
                  "If a Korean source field is empty, return an empty string for its translation."
              )
              body = {
                  "model": "gpt-5.6-luna",
                  "reasoning": {"effort": "none"},
                  "input": [
                      {"role": "system", "content": system},
                      {"role": "user", "content": json.dumps(source, ensure_ascii=False)},
                  ],
              }
              req = urllib.request.Request(
                  "https://api.openai.com/v1/responses",
                  data=json.dumps(body).encode("utf-8"),
                  headers={
                      "Authorization": "Bearer " + api_key,
                      "Content-Type": "application/json",
                  },
                  method="POST",
              )
              with urllib.request.urlopen(req, timeout=90) as resp:
                  data = json.loads(resp.read().decode("utf-8"))

              texts = []
              for item in data.get("output", []):
                  for content in item.get("content", []):
                      if content.get("type") == "output_text":
                          texts.append(content.get("text", ""))
              text = "\n".join(texts).strip()
              text = re.sub(r"^\x60\x60\x60(?:json)?\s*", "", text)
              text = re.sub(r"\s*\x60\x60\x60$", "", text)
              return json.loads(text)

          for work in works:
              needs_title = contains_korean(work.get("title", "")) and (overwrite or not work.get("title_translation_en"))
              needs_materials = bool(work.get("materials_ko")) and (overwrite or not work.get("materials_en"))
              needs_description = bool(work.get("description_ko")) and (overwrite or not work.get("description_en"))

              if not (needs_title or needs_materials or needs_description):
                  continue

              translated = call_openai(work)

              if needs_title:
                  work["title_translation_en"] = translated.get("title_translation_en", "")
                  changed = True
              if needs_materials:
                  work["materials_en"] = translated.get("materials_en", "")
                  changed = True
              if needs_description:
                  work["description_en"] = translated.get("description_en", "")
                  changed = True

          if changed:
              path.write_text(
                  json.dumps(works, ensure_ascii=False, indent=2) + "\n",
                  encoding="utf-8",
              )
          else:
              print("No English draft fields needed translation.")
          PY

      - name: Commit translated drafts
        run: |
          if git diff --quiet -- data/works.json; then
            echo "No translation changes to commit."
            exit 0
          fi
          git config user.name "seoheelee-artwork-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/works.json
          git commit -m "admin: generate English artwork translation drafts"
          git push
